# cielioqueiroz.github.io agora só serve um redirecionamento
# permanente para o site no Vercel (cielio-portfolio.vercel.app).
# O deploy real do portfólio acontece no Vercel via git integration.
name: Pages redirect to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload redirect page
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
