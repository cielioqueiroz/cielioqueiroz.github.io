<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Favicon "Obsidian & Champagne": tile obsidiana arredondada + monograma
       CQ champanhe. Fonte do SISTEMA (Arial/Helvetica) — favicons em <img> não
       carregam web-fonts, então usamos uma família sempre disponível para
       renderizar idêntico em qualquer navegador. -->
  <rect width="64" height="64" rx="14" fill="#0A0908"/>
  <text x="32" y="36" text-anchor="middle" dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif" font-weight="700"
    font-size="29" letter-spacing="-1.5" fill="#D4B896">CQ</text>
</svg>
