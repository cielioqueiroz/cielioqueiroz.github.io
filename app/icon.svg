<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Favicon "Fumaça Grafite": tile carvão arredondada, fumaça branca difusa
       no canto superior e monograma CQ branco. Fonte do SISTEMA
       (Arial/Helvetica) — favicons em <img> não carregam web-fonts. -->
  <defs>
    <radialGradient id="smoke" cx="82%" cy="8%" r="75%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0C0C0D"/>
  <rect width="64" height="64" rx="14" fill="url(#smoke)"/>
  <text x="32" y="36" text-anchor="middle" dominant-baseline="central"
    font-family="Arial, Helvetica, sans-serif" font-weight="700"
    font-size="29" letter-spacing="-1.5" fill="#F0F0F0">CQ</text>
</svg>
